
name: Build Check and Firebase Distribution

on:
  push:
    branches:
      - dev
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze
        continue-on-error: true

      - name: Setup Firebase JSON
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          jq empty android/app/google-services.json

      - name: Build APK
        run: flutter build apk --debug

      - name: Install Firebase CLI
        if: github.event_name != 'pull_request'
        run: npm install -g firebase-tools

      - name: Upload to Firebase App Distribution
        if: github.event_name != 'pull_request'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret is missing"
            exit 1
          fi

          if [ -z "$FIREBASE_APP_ID" ]; then
            echo "FIREBASE_APP_ID secret is missing"
            exit 1
          fi

          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Build from GitHub Actions: $GITHUB_REF_NAME" \
            --token "$FIREBASE_TOKEN"
