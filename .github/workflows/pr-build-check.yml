
name: PR Build Check and Deploy to Firebase App Distribution

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Check Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get Dependencies
        run: flutter pub get

      - name: Configure Firebase Android
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON secret is missing"
            exit 1
          fi

          printf '%s' "$GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

      - name: Build APK
        run: flutter build apk --debug

      - name: Setup Firebase Credentials
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT secret is missing"
            exit 1
          fi

          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" \
            > "$RUNNER_TEMP/firebase-service-account.json"

          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" \
            >> "$GITHUB_ENV"

      - name: Install Firebase CLI
        if: github.event_name == 'push'
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        if: github.event_name == 'push'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          firebase appdistribution:distribute \
            build/app/outputs/flutter-apk/app-debug.apk \
            --app "$FIREBASE_APP_ID" \
            --groups "testers" \
            --release-notes "Build from dev branch"
